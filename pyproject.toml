[project]
name = "gaffer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py314"

lint.select = [
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "A",
    "F",
    "B",
    "E",
    "N",
    "S",
    "PT",
    "RSE",
    "T20",
    "DTZ",
    "COM",
    "ICN",
    "SIM",
    "PTH",
    "FIX",
    "ERA",
    "LOG",
    "C90",
    "ARG001",
    "ARG002",
    "I",
    "D102",
    "D103",
    "D200",
    "D201",
    "D210",
    "D300",
    "D400",
    "D401",
    "D402",
    "D404",
    "D415",
    "D419",
    "RUF200",
]

# COM812 conflicts with the formatter's trailing-comma handling.
lint.ignore = ["COM812"]

lint.fixable = ["ALL"]
lint.unfixable = []
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["S101", "D103", "ANN201"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unused-ignore-comment = "warn"
